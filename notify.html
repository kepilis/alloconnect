<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self';" />
  <title>alloconnect-notify</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
  <style>
    html, body { background: transparent !important; overflow: hidden; height: auto; }
    body { margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; user-select: none; }
    .nt { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: start; padding: 10px 10px 10px 12px; cursor: pointer;
      background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius, 14px);
      box-shadow: 0 12px 34px rgba(0,0,0,.45); animation: ntin .22s ease; position: relative; overflow: hidden; }
    .nt.call { border-color: var(--ok); }
    .nt:hover { border-color: var(--accent); }
    .nt.out { animation: ntout .2s ease forwards; }
    @keyframes ntin { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
    @keyframes ntout { to { opacity: 0; transform: translateX(30px); } }
    .nt-av { width: 44px; height: 44px; border-radius: 50%; background: var(--panel-2) center / cover no-repeat; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: var(--accent); overflow: hidden; }
    .nt-av img { width: 100%; height: 100%; object-fit: cover; }
    .nt-main { min-width: 0; }
    .nt-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nt-body { font-size: 13px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .nt-media { margin-top: 6px; max-width: 100%; max-height: 180px; border-radius: 8px; display: block; }
    .nt-x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; }
    .nt-x:hover { color: var(--text); }
    .nt-bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 100%; transform-origin: left; }
  </style>
</head>
<body>
  <script src="notify.js"></script>
</body>
</html>
